[build]
  publish = "planungs-webseite"
  functions = "netlify/functions"

# posts/, medien/ und captions/ liegen außerhalb von "publish" und werden von den Functions
# post-data.js/media.js/caption-blocks.js zur Laufzeit gelesen - müssen daher explizit ins
# Function-Bundle.
[functions]
  included_files = ["posts/**", "medien/**", "captions/**"]
