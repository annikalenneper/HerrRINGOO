[build]
  publish = "planungs-webseite"
  functions = "netlify/functions"

# posts/ und captions/ liegen außerhalb von "publish" und werden von den Functions
# post-data.js/caption-blocks.js zur Laufzeit gelesen - müssen daher explizit ins
# Function-Bundle. medien/ liegt dagegen innerhalb von "publish" (planungs-webseite/medien/)
# und wird direkt als statische Datei über die CDN ausgeliefert - keine Function, kein
# Response-Size-Limit mehr für große Bilder.
[functions]
  included_files = ["posts/**", "captions/**"]
