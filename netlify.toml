[build]
  publish = "planungs-webseite"
  functions = "netlify/functions"

# captions/ liegt außerhalb von "publish" und wird von caption-blocks.js zur Laufzeit
# gelesen - muss daher explizit ins Function-Bundle. posts/ dagegen NICHT mehr bündeln:
# post-data.js liest live über die GitHub-API (siehe lib/github.js listMarkdownFiles), damit
# neue/geänderte Posts sofort sichtbar sind statt erst nach dem nächsten Redeploy. medien/
# liegt innerhalb von "publish" (planungs-webseite/medien/) und wird direkt als statische
# Datei über die CDN ausgeliefert - keine Function, kein Response-Size-Limit mehr für große
# Bilder.
[functions]
  included_files = ["captions/**"]
