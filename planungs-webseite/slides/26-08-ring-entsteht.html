<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides – Materialkunde · Wie euer Ring entsteht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="toolbar">
  <strong>Materialkunde · Wie euer Ring entsteht</strong>
  <label>Größe
    <select id="scale">
      <option value="0.33">33 %</option>
      <option value="0.5" selected>50 %</option>
      <option value="0.75">75 %</option>
      <option value="1">100 % (1080 × 1350)</option>
    </select>
  </label>
  <label><input type="checkbox" id="safe"> Sicheren Textbereich anzeigen</label>
  <a href="index.html">Alle Slides</a>
</div>
<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide bg5">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-big">Vom Material<br><span class="g">zum Trauring</span></p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Viele Arbeitsschritte für ein einziges Ringpaar.</p>
    </div>
  </div></div><figcaption>Folie 1 (bg 5)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg6">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-big"><span class="g">1 ·</span> Die Legierung</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Gold und weitere Metalle werden nach einer festgelegten Rezeptur zusammengeschmolzen. Daraus entsteht das Ausgangsmaterial für den Ring.</p>
    </div>
  </div></div><figcaption>Folie 2 (bg 6)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg7">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-big"><span class="g">2 ·</span> Der Rohling</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Je nach Modell wird das Material gegossen, geformt, gewalzt oder spanend bearbeitet. Der genaue Weg unterscheidet sich von Hersteller zu Hersteller.</p>
    </div>
  </div></div><figcaption>Folie 3 (bg 7)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg8">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-big"><span class="g">3 ·</span> Form und Steine</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Breite, Stärke und Profil werden ausgearbeitet. Falls Steine vorgesehen sind, werden die Fassungen vorbereitet und die Steine einzeln gesetzt.</p>
    </div>
  </div></div><figcaption>Folie 4 (bg 8)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg1">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-big"><span class="g">4 ·</span> Oberfläche<br>und Gravur</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Zum Schluss erhält der Ring seine polierte, matte oder strukturierte Oberfläche. Danach folgen Gravur, Kontrolle und der Weg zu euch.</p>
    </div>
  </div></div><figcaption>Folie 5 (bg 1)</figcaption></figure>
</main>
<script src="slides.js"></script>
</body>
</html>
