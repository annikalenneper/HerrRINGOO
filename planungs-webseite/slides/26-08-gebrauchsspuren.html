<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide bg8">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-big">Warum jeder Ring<br><span class="g">Spuren bekommt</span></p>
    </div>
  </div></div><figcaption>Folie 1 (bg 8)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg1">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-sub">Ein Trauring berührt jeden Tag Türklinken, Besteck, Werkzeuge und andere Gegenstände. Feine Linien auf der Oberfläche lassen sich deshalb nicht vollständig vermeiden.</p>
    </div>
  </div></div><figcaption>Folie 2 (bg 1)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg2">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-sub">Das ist kein Qualitätsmangel. Es ist schlicht das normale Bild eines Rings, der getragen wird.</p>
    </div>
  </div></div><figcaption>Folie 3 (bg 2)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg3">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-sub">Wie sichtbar die Spuren sind, hängt von Material, Oberfläche und Alltag ab. Auf Hochglanz fallen einzelne Kratzer früh auf. Matte Flächen verändern sich eher gleichmäßig.</p>
    </div>
  </div></div><figcaption>Folie 4 (bg 3)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg4">
    <div class="content">
      <p class="kicker">Materialkunde</p>
      <p class="p-sub">Mit der Zeit entsteht ein ruhigeres Gesamtbild. Wer den ursprünglichen Glanz vermisst, kann die Oberfläche später professionell auffrischen lassen.</p>
    </div>
  </div></div><figcaption>Folie 5 (bg 4)</figcaption></figure>
