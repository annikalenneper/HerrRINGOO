<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides – Materialkunde · Die 4 C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="toolbar">
  <strong>Materialkunde · Die 4 C</strong>
  <label>Größe
    <select id="scale">
      <option value="0.33">33 %</option>
      <option value="0.5" selected>50 %</option>
      <option value="0.75">75 %</option>
      <option value="1">100 % (1080 × 1350)</option>
    </select>
  </label>
  <label><input type="checkbox" id="safe"> Sicheren Textbereich anzeigen</label>
  <a href="index.html">Alle Slides</a>
</div>
<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide bg2">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-xl">Die <span class="g">4 C</span></p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">So werden Diamanten miteinander verglichen.</p>
    </div>
  </div></div><figcaption>Folie 1 (bg 2)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg3">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-big"><span class="g">Carat</span> · Gewicht</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Ein Karat entspricht 0,2 Gramm. Es beschreibt das Gewicht, nicht die sichtbare Größe. Zwei gleich schwere Steine können deshalb unterschiedlich groß wirken.</p>
    </div>
  </div></div><figcaption>Folie 2 (bg 3)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg4">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-big"><span class="g">Cut</span> · Schliff</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Der Schliff bestimmt, wie ein Diamant das Licht zurückwirft. Gute Proportionen sorgen für Helligkeit und das typische Funkeln.</p>
    </div>
  </div></div><figcaption>Folie 3 (bg 4)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg5">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-big"><span class="g">Color</span> · Farbe</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Bei weißen Diamanten wird beurteilt, wie farblos sie erscheinen. Kleine Unterschiede sind oft erst im direkten Vergleich zu erkennen.</p>
    </div>
  </div></div><figcaption>Folie 4 (bg 5)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg6">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-big"><span class="g">Clarity</span> · Reinheit</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text small">Viele Diamanten enthalten winzige Einschlüsse. Häufig sind sie mit bloßem Auge nicht sichtbar, helfen aber dabei, einen Stein eindeutig zu beschreiben. Erst alle vier Merkmale zusammen ergeben ein vollständiges Bild.</p>
    </div>
  </div></div><figcaption>Folie 5 (bg 6)</figcaption></figure>
</main>

</body>
</html>
