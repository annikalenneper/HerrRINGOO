<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Slides – Beratung · Empfindliche Haut und Schmuck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="toolbar">
  <strong>Beratung · Empfindliche Haut und Schmuck</strong>
  <label>Größe
    <select id="scale">
      <option value="0.33">33 %</option>
      <option value="0.5" selected>50 %</option>
      <option value="0.75">75 %</option>
      <option value="1">100 % (1080 × 1350)</option>
    </select>
  </label>
  <label><input type="checkbox" id="safe"> Sicheren Textbereich anzeigen</label>
  <a href="index.html">Alle Slides</a>
</div>
<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide ibg1">
    <div class="content">
      <p class="kicker">Beratung</p>
      <p class="p-big">Wenn die Haut<br><span class="g">empfindlich reagiert</span></p>
    </div>
  </div></div><figcaption>Folie 1 (invertiert, bg 1)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide ibg2">
    <div class="content">
      <p class="kicker">Beratung</p>
      <p class="p-sub">Manche Menschen kennen es von Modeschmuck, Uhren oder Gürtelschnallen. Die Haut reagiert auf ein bestimmtes Metall, häufig auf Nickel.</p>
    </div>
  </div></div><figcaption>Folie 2 (invertiert, bg 2)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide ibg3">
    <div class="content">
      <p class="kicker">Beratung</p>
      <p class="p-sub">In der EU ist deshalb streng begrenzt, wie viel Nickel Schmuck bei längerem Hautkontakt abgeben darf.</p>
    </div>
  </div></div><figcaption>Folie 3 (invertiert, bg 3)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide ibg4">
    <div class="content">
      <p class="kicker">Beratung</p>
      <p class="p-sub">Je nach Empfindlichkeit können Platin, Titan oder ausgewählte Gold- und Palladiumlegierungen gute Möglichkeiten sein. Entscheidend ist immer die genaue Zusammensetzung des Rings.</p>
    </div>
  </div></div><figcaption>Folie 4 (invertiert, bg 4)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide ibg5">
    <div class="content">
      <p class="kicker">Beratung</p>
      <p class="p-sub">Sagt bei der Terminvereinbarung kurz Bescheid, wenn ihr bekannte Unverträglichkeiten habt. Dann können wir die Auswahl von Anfang an darauf abstimmen.</p>
    </div>
  </div></div><figcaption>Folie 5 (invertiert, bg 5)</figcaption></figure>
</main>
<script src="slides.js"></script>
</body>
</html>
