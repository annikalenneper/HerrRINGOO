<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides – Materialkunde · Gelb, Weiß oder Rosé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="toolbar">
  <strong>Materialkunde · Gelb, Weiß oder Rosé</strong>
  <label>Größe
    <select id="scale">
      <option value="0.33">33 %</option>
      <option value="0.5" selected>50 %</option>
      <option value="0.75">75 %</option>
      <option value="1">100 % (1080 × 1350)</option>
    </select>
  </label>
  <label><input type="checkbox" id="safe"> Sicheren Textbereich anzeigen</label>
  <a href="index.html">Alle Slides</a>
</div>
<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide bg6">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-xl">Gelb, Weiß</p>
      <p class="p-oder">oder</p>
      <p class="p-xl g">Rosé</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Woher kommt die Farbe des Goldes?</p>
    </div>
  </div></div><figcaption>Folie 1 (bg 6)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg7">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-sub">Der Goldanteil kann gleich bleiben. 585 bleibt 585, 750 bleibt 750. Für die Farbe sind vor allem die übrigen Bestandteile der Legierung entscheidend.</p>
    </div>
  </div></div><figcaption>Folie 2 (bg 7)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg8">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-title">Gelbgold</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Silber und Kupfer bringen das Feingold in einen warmen, klassischen Ton. Die genaue Nuance unterscheidet sich je nach Rezeptur.</p>
    </div>
  </div></div><figcaption>Folie 3 (bg 8)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg1">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-title">Roségold</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Ein höherer Kupferanteil macht die Farbe wärmer und rötlicher. Manche Legierungen wirken nur zart rosé, andere deutlich kräftiger.</p>
    </div>
  </div></div><figcaption>Folie 4 (bg 1)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg2">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-title">Weißgold</p>
      <p class="dia" aria-hidden="true">◆</p>
      <p class="p-text">Helle Metalle wie Palladium nehmen dem Gold seinen gelben Ton. Das Ergebnis reicht von kühlem Weiß bis zu einem dezenten Grauton.</p>
    </div>
  </div></div><figcaption>Folie 5 (bg 2)</figcaption></figure>
</main>
<script src="slides.js"></script>
</body>
</html>
