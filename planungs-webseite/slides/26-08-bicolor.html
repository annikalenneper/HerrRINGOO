<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides – Materialkunde · Bicolor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="toolbar">
  <strong>Materialkunde · Bicolor</strong>
  <label>Größe
    <select id="scale">
      <option value="0.33">33 %</option>
      <option value="0.5" selected>50 %</option>
      <option value="0.75">75 %</option>
      <option value="1">100 % (1080 × 1350)</option>
    </select>
  </label>
  <label><input type="checkbox" id="safe"> Sicheren Textbereich anzeigen</label>
  <a href="index.html">Alle Slides</a>
</div>
<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide bg3">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-big">Zwei Farben<br><span class="g">in einem Ring</span></p>
      <p class="dia">◆</p>
      <p class="p-text">So funktioniert Bicolor.</p>
    </div>
  </div></div><figcaption>Folie 1 (bg 3)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg4">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-sub">Bei einem Bicolor-Ring treffen zwei Edelmetallfarben aufeinander. Häufig sind das Gelb- oder Roségold zusammen mit Weißgold.</p>
    </div>
  </div></div><figcaption>Folie 2 (bg 4)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg5">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-sub">Die Farben können als breite Flächen, feine Linien oder getrennte Innen- und Außenseiten gestaltet werden.</p>
    </div>
  </div></div><figcaption>Folie 3 (bg 5)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg6">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-sub">Dadurch kann ein Ring aus jeder Perspektive anders wirken. Außen ruhig und hell, innen warm. Oder genau umgekehrt.</p>
    </div>
  </div></div><figcaption>Folie 4 (bg 6)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg7">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-sub">Bicolor passt auch gut, wenn ihr unterschiedliche Schmuckfarben tragt oder euch als Paar nicht auf einen einzigen Ton festlegen möchtet.</p>
    </div>
  </div></div><figcaption>Folie 5 (bg 7)</figcaption></figure>
</main>
<script src="slides.js"></script>
</body>
</html>
