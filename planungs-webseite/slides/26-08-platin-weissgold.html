<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides – Materialkunde · Platin oder Weißgold?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="toolbar">
  <strong>Materialkunde · Platin oder Weißgold?</strong>
  <label>Größe
    <select id="scale">
      <option value="0.33">33 %</option>
      <option value="0.5" selected>50 %</option>
      <option value="0.75">75 %</option>
      <option value="1">100 % (1080 × 1350)</option>
    </select>
  </label>
  <label><input type="checkbox" id="safe"> Sicheren Textbereich anzeigen</label>
  <a href="index.html">Alle Slides</a>
</div>
<main class="deck">

  <figure class="frame"><div class="stage"><div class="slide bg1">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-xl">Platin</p>
      <p class="p-oder">oder</p>
      <p class="p-xl g">Weißgold?</p>
      <p class="dia">◆</p>
      <p class="p-text">Zwei helle Materialien, die sich deutlich unterschiedlich anfühlen.</p>
    </div>
  </div></div><figcaption>Folie 1 (bg 1)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg2">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-big">Auf Fotos wirken sie oft ähnlich.</p>
      <p class="dia">◆</p>
      <p class="p-sub">Am Finger merkt man den Unterschied <span class="g">schneller.</span></p>
    </div>
  </div></div><figcaption>Folie 2 (bg 2)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg3">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-title">Weißgold</p>
      <p class="dia">◆</p>
      <p class="p-text">Eine Goldlegierung mit hellen Zusatzmetallen. Es ist leichter als Platin und kann je nach Rezeptur und Oberfläche kühlweiß oder leicht warmgrau wirken.</p>
    </div>
  </div></div><figcaption>Folie 3 (bg 3)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg4">
    <p class="kicker">Materialkunde</p>
    <div class="content">
      <p class="p-title">Platin</p>
      <p class="dia">◆</p>
      <p class="p-text">Von Natur aus hell, sehr dicht und spürbar schwerer. Mit der Zeit entwickelt die Oberfläche feine Tragespuren und einen weicheren Schimmer. Für alle, die ein Schmuckstück gern fühlen.</p>
    </div>
  </div></div><figcaption>Folie 4 (bg 4)</figcaption></figure>

  <figure class="frame"><div class="stage"><div class="slide bg5">
    <p class="kicker">Unser Tipp</p>
    <div class="content">
      <p class="p-big nw">Fühlen statt raten</p>
      <p class="dia">◆</p>
      <p class="p-text small">Welches sich richtiger anfühlt, verrät kein Text und kein Foto. Gewicht, Ringbreite und Tragegefühl spielen ebenso mit. Deshalb könnt ihr beide Materialien bei der Beratung direkt anprobieren.</p>
    </div>
  </div></div><figcaption>Folie 5 (bg 5)</figcaption></figure>
</main>
<script src="slides.js"></script>
</body>
</html>
